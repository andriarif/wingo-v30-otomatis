<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI MASTER V30 - AUTO</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:sans-serif; text-align: center; }
body { background: #000; color: #fff; }
#mainPanel { width: 96%; margin: 10px auto; border-radius: 12px; padding: 10px; border: 2px solid #0ff; background: #111; }
.timer-container { font-size: 24px; color: #0f0; font-weight: 900; margin-bottom: 5px; }
#statusAPI { font-size: 10px; color: #ffd700; margin-bottom: 10px; }
.table-wrap { height: 380px; overflow-y: auto; background: #fff; border-radius: 5px; }
table { width: 100%; border-collapse: collapse; color: #000; }
th { font-size: 10px; background: #333; color: #fff; padding: 8px; position: sticky; top: 0; }
td { border: 1px solid #ddd; font-size: 11px; font-weight: bold; padding: 8px 0; }
.besar { color: #0088cc; } .kecil { color: #cc7a00; }
.win { color: green; font-weight: 900; } .lose { color: red; }
.mini-sim { margin-top: 10px; padding: 10px; background: #222; border-radius: 8px; font-size: 12px; }
#kompenBox { background: red; color: white; padding: 5px; margin-top: 5px; border-radius: 4px; font-weight: bold; }
</style>
</head>
<body>

<div id="mainPanel">
    <div style="font-weight: 900; color: #0ff;">AI MASTER V30 AUTO</div>
    <div class="timer-container" id="timerBox">00:00</div>
    <div id="statusAPI">MENGHUBUNGKAN API...</div>

    <div class="table-wrap">
        <table>
            <thead><tr><th>PERIODE</th><th>PREDIKSI</th><th>MODE</th><th>HASIL</th><th>STATUS</th></tr></thead>
            <tbody id="dataBody"></tbody>
        </table>
    </div>

    <div class="mini-sim">
        <div>SALDO: <span id="dispSaldo" style="color:#0ff">Rp 0</span> | PROFIT: <span id="dispProfit" style="color:#0f0">Rp 0</span></div>
        <div id="kompenBox">K0: Rp 1.000</div>
    </div>
</div>

<script>
let lastPeriode = ""; let dataMap = {}; let historyResult = [];
let totalWin = 0; let totalLose = 0; let currentKompen = 0;
let aiState = "WT"; let currentSide = null;

function buatPrediksiAI(hist) {
    if (aiState !== "WT" && currentSide !== null) return { prediksi: currentSide, pola: aiState };
    
    // Logika Fraktal (Puncak/Lembah)
    if (hist[1] > hist[0] && hist[1] > hist[2]) { aiState = "SIG"; currentSide = "KECIL"; return { prediksi: "KECIL", pola: "SIG" }; }
    if (hist[1] < hist[0] && hist[1] < hist[2]) { aiState = "SIG"; currentSide = "BESAR"; return { prediksi: "BESAR", pola: "SIG" }; }
    
    return { prediksi: "SKIP", pola: "WT" };
}

async function fetchData() {
    try {
        const res = await fetch("/api/get-data");
        const json = await res.json();
        
        if (!json.data || !json.data.gameslist) {
            document.getElementById("statusAPI").innerText = "API ERROR / SEDANG MAINTENANCE";
            return;
        }

        const list = json.data.gameslist;
        const pSekarang = String(json.period);
        document.getElementById("statusAPI").innerText = "API TERHUBUNG (STABLE)";

        // Cek jika ada periode baru
        if (pSekarang !== lastPeriode) {
            if (lastPeriode !== "") {
                const hasilTadi = list.find(g => String(g.period) === lastPeriode);
                if (hasilTadi) updateResult(lastPeriode, parseInt(hasilTadi.amount));
            }

            lastPeriode = pSekarang;
            historyResult = list.slice(0, 5).map(g => parseInt(g.amount));
            const ai = buatPrediksiAI(historyResult);
            dataMap[pSekarang] = ai;

            tambahBaris(pSekarang, ai);
        }
    } catch (e) {
        document.getElementById("statusAPI").innerText = "KONEKSI BERMASALAH...";
    }
}

function tambahBaris(p, ai) {
    const tbody = document.getElementById("dataBody");
    if (document.getElementById("row-" + p)) return;

    const tr = document.createElement("tr");
    tr.id = "row-" + p;
    const predTxt = ai.prediksi === "SKIP" ? "SKIP" : ai.prediksi;
    tr.innerHTML = `
        <td>${p.slice(-4)}</td>
        <td class="${ai.prediksi.toLowerCase()}">${predTxt}</td>
        <td>${ai.pola}</td>
        <td id="res-${p}">..</td>
        <td id="stat-${p}">..</td>
    `;
    tbody.insertBefore(tr, tbody.firstChild);
}

function updateResult(p, angka) {
    const ai = dataMap[p];
    if (!ai || ai.prediksi === "SKIP") return;

    const tipe = angka <= 4 ? "KECIL" : "BESAR";
    const win = (ai.prediksi === tipe);
    
    document.getElementById("res-" + p).innerText = angka + " (" + (tipe === "BESAR" ? "B" : "K") + ")";
    const statCell = document.getElementById("stat-" + p);

    if (win) {
        statCell.innerHTML = '<span class="win">WIN</span>';
        currentKompen = 0; aiState = "FLW"; currentSide = tipe;
    } else {
        statCell.innerHTML = '<span class="lose">LOSE</span>';
        currentKompen++;
        if (aiState === "SIG") {
            aiState = "REV"; currentSide = (ai.prediksi === "BESAR" ? "KECIL" : "BESAR");
        } else {
            aiState = "WT"; currentSide = null; currentKompen = 0;
        }
    }
    document.getElementById("kompenBox").innerText = `K${currentKompen}: Rp ${(1000 * Math.pow(2, currentKompen)).toLocaleString()}`;
}

setInterval(fetchData, 2000); // Cek API tiap 2 detik
setInterval(() => {
    let s = new Date().getSeconds();
    let rem = (s < 30) ? 30 - s : 60 - s;
    document.getElementById("timerBox").innerText = "00:" + (rem < 10 ? "0" + rem : rem);
}, 1000);

fetchData(); // Jalankan langsung saat buka
</script>
</body>
</html>
